# ==============================================================================
# 🐙 docker-compose.yml: 컨테이너 실행 및 포트 포워딩 설정 파일
# ==============================================================================
# `docker compose up -d` 한 줄로 컨테이너 빌드부터 백그라운드 실행까지 한 번에 처리합니다.

services:
  web:
    # 1. 빌드 컨텍스트: 현재 디렉토리('.')의 Dockerfile을 기반으로 이미지를 빌드합니다.
    build: .

    # 2. 생성될 이미지 이름 및 태그 지정
    image: ilikeaws-web:latest

    # 3. 실행할 컨테이너 이름 지정 (docker ps 명령 시 식별용)
    container_name: ilikeaws-web-server

    # 4. 자동 재시작 정책: EC2 서버가 재부팅되거나 예기치 않게 종료되어도 항상 자동으로 컨테이너를 다시 켭니다.
    restart: always

    # 5. 포트 매핑 (호스트 포트 : 컨테이너 포트)
    #    외부 사용자가 EC2 인스턴스의 80번(HTTP) 포트로 접근하면 컨테이너의 80번 포트로 바로 연결됩니다.
    ports:
      - "80:80"

