# ==============================================================================
# 🌐 nginx.conf: Nginx 웹 서버 라우팅 및 가상 호스트 환경설정
# ==============================================================================

server {
    # 1. 80번(기본 HTTP) 포트로 들어오는 IPv4 및 IPv6 요청을 수신합니다.
    listen 80 default_server;
    listen [::]:80 default_server;

    # 2. 호스트 도메인 이름 지정: '_'는 모든 도메인/IP 주소 요청을 처리하겠다는 의미입니다.
    server_name _;

    # 3. 정적 웹 파일이 위치한 기본 루트 디렉토리 및 메인 인덱스 파일 정의
    root /usr/share/nginx/html;
    index index.html;

    # 4. 일반 웹 요청 (/) 처리 경로
    #    요청한 파일($uri)이나 디렉토리($uri/)가 있으면 서빙하고, 없으면 404 에러를 반환합니다.
    location / {
        try_files $uri $uri/ =404;
    }

    # 5. 헬스체크 엔드포인트 (/health)
    #    AWS 로드밸런서(ALB)나 모니터링 시스템이 서버가 정상 동작 중인지 검사할 때 호출합니다.
    #    HTTP 상태코드 200과 함께 "OK" 텍스트를 즉시 반환합니다.
    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    # 6. 접근 로그와 에러 로그 저장 경로
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

